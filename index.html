<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植光製作所 ・ 預約點單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F3EC;
  --paper:#EDE8DC;
  --moss:#3D5A3E;
  --moss-light:#5A7A5B;
  --moss-pale:#C8D9C8;
  --ink:#2C2C22;
  --ink-soft:#5C5848;
  --ink-muted:#8E8A7A;
  --border:#C8C0A8;
}
body{background:var(--cream);font-family:'Noto Serif JP',serif;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:2.5rem 1.5rem 4rem}

.header{text-align:center;margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:0.5px solid var(--border)}
.logo-img{height:90px;object-fit:contain;display:block;margin:0 auto 0.5rem}
.logo-sub{font-family:'Zen Kurenaido',cursive;font-size:11px;letter-spacing:0.22em;color:var(--ink-muted)}

.sec-wrap{margin-bottom:2rem}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:0.6rem}
.sec-line{flex:1;height:0.5px;background:var(--border)}
.sec-label{font-size:10px;letter-spacing:0.2em;color:var(--moss);font-family:'Zen Kurenaido',cursive;white-space:nowrap}
.sec-badge{font-size:10px;color:var(--moss);background:var(--moss-pale);border-radius:2px;padding:2px 8px;letter-spacing:0.06em}
.mix-bar{font-size:11px;color:var(--moss-light);background:#EBF1EB;border-left:2px solid var(--moss-pale);padding:7px 10px;margin-bottom:12px;letter-spacing:0.04em;border-radius:0 2px 2px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.fcard{background:#FDFAF5;border:0.5px solid var(--border);border-radius:4px;padding:14px 12px 11px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;position:relative}
.fcard:hover{border-color:var(--moss-light);background:#F3F7F3}
.fcard.on{border:1.5px solid var(--moss);background:#EDF4ED}
.fcard.on::before{content:'✓';position:absolute;top:8px;right:10px;font-size:10px;color:var(--moss);font-family:sans-serif}
.fn{font-size:13.5px;font-weight:400;color:var(--ink);margin-bottom:4px;line-height:1.5}
.fp{font-size:11px;color:var(--ink-muted);letter-spacing:.04em}
.fqrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.qb{width:24px;height:24px;border-radius:50%;border:0.5px solid var(--border);background:#FDFAF5;color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;font-family:sans-serif;line-height:1}
.qb:hover{background:var(--moss-pale)}
.qn{font-size:14px;font-weight:500;min-width:18px;text-align:center;color:var(--ink);font-family:sans-serif}

.divider{width:40px;height:0.5px;background:var(--border);margin:2rem auto}

.summary-wrap{background:#FDFAF5;border:0.5px solid var(--border);border-radius:4px;padding:1.25rem 1.5rem;margin:1rem 0 1.5rem}
.summary-title{font-size:10px;letter-spacing:.2em;color:var(--moss);margin-bottom:12px;font-family:'Zen Kurenaido',cursive}
.srow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);padding:4px 0}
.stotal{border-top:0.5px solid var(--border);margin-top:10px;padding-top:10px;font-size:15px;font-weight:500;color:var(--ink)}
.shint{font-size:12px;color:var(--ink-muted);text-align:center;padding:8px 0;letter-spacing:.08em;font-family:'Zen Kurenaido',cursive}

.name-row{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.name-row label{font-size:10px;letter-spacing:.14em;color:var(--moss);font-family:'Zen Kurenaido',cursive}
.name-row input{font-family:'Noto Serif JP',serif;font-size:13px;padding:8px 10px;border:0.5px solid var(--border);border-radius:2px;background:#FDFAF5;color:var(--ink);outline:none;transition:border-color .15s}
.name-row input:focus{border-color:var(--moss-light)}
.name-row input::placeholder{color:var(--ink-muted);font-size:12px}

.sbtn{width:100%;padding:14px;border-radius:2px;border:0.5px solid var(--moss);background:var(--moss);color:#FDFAF5;font-size:13px;font-weight:400;letter-spacing:.14em;cursor:pointer;transition:background .15s;font-family:'Noto Serif JP',serif;margin-top:0.5rem}
.sbtn:hover{background:var(--moss-light)}
.sbtn:active{transform:scale(0.99)}
.sbtn:disabled{background:var(--paper);color:var(--ink-muted);border-color:var(--border);cursor:not-allowed}

.confirm-box{display:none;background:#EDF4ED;border:0.5px solid var(--moss-pale);border-radius:4px;padding:1.5rem;margin-top:1.5rem;line-height:2;font-size:13px;color:var(--ink-soft)}
.confirm-box h3{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--moss);margin-bottom:1rem;font-family:'Zen Kurenaido',cursive}
.confirm-box .citem{display:flex;justify-content:space-between}
.confirm-box .ctotal{border-top:0.5px solid var(--moss-pale);margin-top:8px;padding-top:8px;font-weight:500;color:var(--ink);display:flex;justify-content:space-between}
.confirm-box .cmeta{margin-top:1rem;padding-top:1rem;border-top:0.5px solid var(--moss-pale);font-size:12px;color:var(--ink-muted);line-height:1.9}
.confirm-box .cmeta a{color:var(--moss-light);text-underline-offset:2px}
.copy-btn{margin-top:1rem;width:100%;padding:10px;border-radius:2px;border:0.5px solid var(--moss);background:transparent;color:var(--moss);font-size:12px;letter-spacing:.1em;cursor:pointer;font-family:'Zen Kurenaido',cursive;transition:background .15s}
.copy-btn:hover{background:var(--moss-pale)}

@media(max-width:480px){
  .wrap{padding:1.5rem 1rem 3rem}
  .logo-img{height:70px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const counts={};
function isEve(){return document.getElementById('inp-loc')&&document.getElementById('inp-loc').value.includes('伊芙');}
function getPrice(item){return isEve()&&item.evePrice?item.evePrice:item.price;}
menu.forEach(s=>s.items.forEach(i=>counts[i.id]=0));

function renderMenu(){
  const el=document.getElementById('menuArea');
  el.innerHTML='';
  menu.forEach(s=>{
    const sw=document.createElement('div');sw.className='sec-wrap';
    const sh=document.createElement('div');sh.className='sec-head';
    sh.innerHTML=`<div class="sec-line"></div><div class="sec-label">${s.section}</div>${s.note?`<span class="sec-badge">${s.note}</span>`:''}<div class="sec-line"></div>`;
    sw.appendChild(sh);
    if(s.mixNote){const mb=document.createElement('div');mb.className='mix-bar';mb.textContent=s.mixNote;sw.appendChild(mb);}
    const grid=document.createElement('div');grid.className='grid';
    s.items.forEach(item=>{
      const c=document.createElement('div');
      c.className='fcard'+(counts[item.id]>0?' on':'');
      c.innerHTML=`<div class="fn">${item.name}</div><div class="fp">${isEve()&&item.evePrice?`<span style='color:#3D5A3E;font-weight:500'>NT$ ${item.evePrice}</span> <span style='text-decoration:line-through;color:#aaa;font-size:10px'>${item.price}</span>`:`NT$ ${item.price}`}／${item.unit}</div><div class="fqrow"><button class="qb" onclick="chg('${item.id}',-1)">－</button><span class="qn">${counts[item.id]}</span><button class="qb" onclick="chg('${item.id}',1)">＋</button></div>`;
      grid.appendChild(c);
    });
    sw.appendChild(grid);el.appendChild(sw);
  });
}

  '寶山工作室自取（週一、五 10:00–16:00）': '📍 新竹縣寶山鄉寶新路二段251巷18號　｜　開放時間：週一・週五 10:00–16:00',
  '全家新竹勝利店（週一三四五六日 18:00 後）': '📍 新竹市北區育英路1號　｜　週一、三、四、五、六、日 18:00 後面交',

};

function allItems(){const out=[];menu.forEach(s=>s.items.forEach(i=>{if(counts[i.id]>0)out.push(i)}));return out;}

function renderSummary(){
  const items=allItems();
  const hint=document.getElementById('hint');
  const si=document.getElementById('sitems');
  const st=document.getElementById('stotal');
  if(!items.length){hint.style.display='';si.innerHTML='';st.innerHTML='';return;}
  hint.style.display='none';
  let total=0;
  si.innerHTML=items.map(i=>{const sub=getPrice(i)*counts[i.id];total+=sub;return`<div class="srow"><span>${i.name} × ${counts[i.id]} ${i.unit}</span><span>NT$ ${sub}</span></div>`;}).join('');
  st.innerHTML=`<div class="srow stotal"><span>合　計</span><span>NT$ ${total}</span></div>`;
}

function checkBtn(){
  const items=allItems();
  document.getElementById('sbtn').disabled=!items.length;
}

function doCopy(){
  const items=allItems();
  if(!items.length)return;
  const name=document.getElementById('inp-name').value.trim()||'（未填）';
  const tel=document.getElementById('inp-tel').value.trim()||'（未填）';
  const time=document.getElementById('inp-time').value.trim()||'（未填）';
  const loc=document.getElementById('inp-loc').value;
  let total=0;
  const lines=items.map(i=>{const sub=i.price*counts[i.id];total+=sub;return`- ${i.name} × ${counts[i.id]} ${i.unit}　NT$ ${sub}`;}).join('\n');
  const loc2=loc.includes('寶山')
    ? '寶山工作室自取（週一、五 10:00–16:00）\n新竹縣寶山鄉寶新路二段251巷18號'
    : loc.includes('伊芙')
      ? '伊芙髮型取貨（週二公休）'
      : '全家新竹勝利店（新竹市北區育英路1號）（週一、三、四、五、六、日 18:00 後）\nhttps://www.family.com.tw/Marketing/storemapMobile/shop_place.aspx?serid=59686';
  const text=`✨ 植光製作所 ・ 預約面交單\n\n備單姓名：${name}\n聯絡電話：${tel}\n\n【預訂品項】\n${lines}\n\n總計金額：NT$ ${total} 元\n\n面交時間：${time}\n面交地點：${loc2}\n\n訂單確認後，會再傳訊息與您確認唷！期待見面 🌿`;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.textContent='✓ 已複製';setTimeout(()=>btn.textContent='複製訂單內容',2000);
  });
}

renderSummary();
